<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="自作Webツールをまとめた個人用リンク集" />
  <title>Secret Links</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="loginScreen" class="login-card" aria-labelledby="loginTitle">
      <p class="badge">Private Link Collection</p>
      <h1 id="loginTitle">秘密のリンク集</h1>
      <p class="description">パスワードを知っている人だけがリンク集を表示できます。</p>

      <form id="loginForm" class="login-form">
        <label for="passwordInput">パスワード</label>
        <input
          id="passwordInput"
          type="password"
          placeholder="パスワードを入力"
          autocomplete="current-password"
          required
        />
        <button type="submit" class="main-button">入る</button>
      </form>

      <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
      <p class="note">※ このサイトはGitHub Pages用の簡易ロックです。</p>
    </section>

    <section id="linksScreen" class="links-screen hidden" aria-labelledby="linksTitle">
      <header class="header">
        <div>
          <p class="badge">Unlocked</p>
          <h1 id="linksTitle">リンク集</h1>
          <p class="description">自分で作ったツールをまとめるページです。</p>
        </div>
        <button id="logoutButton" class="logout-button" type="button">ログアウト</button>
      </header>

      <section class="portal-tools" aria-label="ツールの検索と表示切り替え">
        <div class="search-box">
          <span aria-hidden="true">🔎</span>
          <input id="searchInput" type="search" placeholder="ツール名・説明から検索" autocomplete="off" />
          <button id="clearSearchButton" class="clear-search hidden" type="button">クリア</button>
        </div>
        <div class="view-filter" aria-label="表示するツール">
          <button class="view-button active" type="button" data-view="all" aria-pressed="true">すべて</button>
          <button class="view-button" type="button" data-view="favorites" aria-pressed="false">★ お気に入り</button>
          <button class="view-button" type="button" data-view="recent" aria-pressed="false">🕘 最近使った</button>
        </div>
      </section>

      <section id="recentSection" class="quick-section hidden" aria-labelledby="recentTitle">
        <div class="quick-heading"><h2 id="recentTitle">最近使ったツール</h2><button id="clearRecentButton" type="button">履歴を消す</button></div>
        <div id="recentGrid" class="quick-grid"></div>
      </section>

      <nav class="category-filter" aria-label="ツールのカテゴリー">
        <button class="filter-button active" type="button" data-category="all" aria-pressed="true">すべて</button>
        <button class="filter-button" type="button" data-category="management" aria-pressed="false">時間・管理</button>
        <button class="filter-button" type="button" data-category="study" aria-pressed="false">文章・学習</button>
        <button class="filter-button" type="button" data-category="selection" aria-pressed="false">抽選・スポーツ</button>
        <button class="filter-button" type="button" data-category="design" aria-pressed="false">デザイン・画像</button>
        <button class="filter-button" type="button" data-category="development" aria-pressed="false">Web・開発</button>
        <button class="filter-button" type="button" data-category="game" aria-pressed="false">ゲーム</button>
      </nav>

      <p id="resultCount" class="result-count" aria-live="polite"></p>
      <section id="linkGrid" class="link-grid" aria-label="ツール一覧"></section>
      <p id="emptyMessage" class="empty-message hidden">条件に合うツールはありません。</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
